<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1080" viewBox="0 0 960 1080" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <!-- 箭头 -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <marker id="arrowDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
    <!-- 阴影 -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="960" height="1080" fill="#f8fafc"/>

  <!-- 标题 -->
  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">灵犀智能客服系统 · 架构图</text>

  <!-- ============================================================ -->
  <!-- 第一层：用户接入层 (y: 70-190)                                  -->
  <!-- ============================================================ -->
  <rect x="40" y="70" width="880" height="120" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="60" y="92" font-size="13" font-weight="700" fill="#2563eb">第一层 · 用户接入层</text>

  <!-- 商城前台 -->
  <rect x="70" y="105" width="150" height="65" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="145" y="130" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">商城前台</text>
  <text x="145" y="148" text-anchor="middle" font-size="10" fill="#64748b">Vue3 SPA · HTTP</text>

  <!-- 客服悬浮窗 -->
  <rect x="250" y="105" width="150" height="65" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="325" y="130" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">客服悬浮窗</text>
  <text x="325" y="148" text-anchor="middle" font-size="10" fill="#64748b">ChatWidget · WSS</text>

  <!-- 独立对话页 -->
  <rect x="430" y="105" width="150" height="65" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="505" y="130" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">独立对话页</text>
  <text x="505" y="148" text-anchor="middle" font-size="10" fill="#64748b">ChatPage · WSS</text>

  <!-- Nginx -->
  <rect x="640" y="105" width="240" height="65" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="760" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Nginx 反向代理 :80/:443</text>
  <text x="760" y="148" text-anchor="middle" font-size="10" fill="#1e40af">HTTP路由 · WebSocket升级 · 静态托管</text>

  <!-- 箭头：3个入口 → Nginx -->
  <path d="M220,138 L635,138" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M400,138 L635,138" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M580,138 L635,138" fill="none" stroke="#64748b" stroke-width="1.5"/>

  <!-- ============================================================ -->
  <!-- 第二层：应用服务层 (y: 210-330)                                 -->
  <!-- ============================================================ -->
  <rect x="40" y="210" width="880" height="120" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="60" y="232" font-size="13" font-weight="700" fill="#16a34a">第二层 · 应用服务层</text>

  <!-- 前端服务 -->
  <rect x="120" y="245" width="300" height="70" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="270" y="270" text-anchor="middle" font-size="13" font-weight="600" fill="#166534">前端服务 :3000</text>
  <text x="270" y="288" text-anchor="middle" font-size="10" fill="#64748b">Vue3 + Element Plus</text>
  <text x="270" y="302" text-anchor="middle" font-size="10" fill="#64748b">商城页面 / 后台管理 / 对话组件</text>

  <!-- 后端服务 -->
  <rect x="540" y="245" width="300" height="70" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="690" y="270" text-anchor="middle" font-size="13" font-weight="600" fill="#166534">后端服务 :8000</text>
  <text x="690" y="288" text-anchor="middle" font-size="10" fill="#64748b">FastAPI 异步框架</text>
  <text x="690" y="302" text-anchor="middle" font-size="10" fill="#64748b">REST API / WebSocket / 鉴权</text>

  <!-- Nginx → 前端/后端 -->
  <path d="M760,170 L760,190 L270,190 L270,245" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M760,170 L760,190 L690,190 L690,245" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============================================================ -->
  <!-- 第三层：智能对话层（核心）(y: 350-640)                          -->
  <!-- ============================================================ -->
  <rect x="40" y="350" width="880" height="290" rx="10" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="60" y="372" font-size="13" font-weight="700" fill="#d97706">第三层 · 智能对话层（核心）</text>

  <!-- Bot 层 -->
  <rect x="70" y="385" width="820" height="55" rx="8" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="85" y="407" font-size="12" font-weight="700" fill="#92400e">Bot 层（第一层拦截）</text>
  <rect x="230" y="395" width="300" height="35" rx="6" fill="#fffbeb" stroke="#fbbf24" stroke-width="1"/>
  <text x="380" y="417" text-anchor="middle" font-size="11" fill="#92400e">关键词干预（精确/包含匹配）→ 直接回答</text>
  <rect x="560" y="395" width="310" height="35" rx="6" fill="#fffbeb" stroke="#fbbf24" stroke-width="1"/>
  <text x="715" y="417" text-anchor="middle" font-size="11" fill="#92400e">FAQ混合检索 BM25(30%)+向量(70%) 阈值0.85</text>

  <!-- 未命中箭头 -->
  <path d="M480,440 L480,460" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="495" y="455" font-size="10" fill="#64748b">未命中</text>

  <!-- Agent 层 -->
  <rect x="70" y="460" width="820" height="120" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="85" y="482" font-size="12" font-weight="700" fill="#92400e">Agent 层（LangGraph 工作流）</text>

  <!-- Agent 横向流程 -->
  <rect x="85" y="495" width="100" height="30" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="135" y="514" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">意图识别</text>

  <path d="M185,510 L205,510" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="205" y="495" width="100" height="30" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="255" y="514" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">闲聊拦截</text>
  <text x="255" y="535" text-anchor="middle" font-size="9" fill="#b45309">预设回复&lt;100ms</text>

  <path d="M305,510 L325,510" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="325" y="495" width="100" height="30" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="375" y="514" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">情绪检测</text>
  <text x="375" y="535" text-anchor="middle" font-size="9" fill="#b45309">angry→转人工</text>

  <path d="M425,510 L445,510" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="445" y="495" width="100" height="30" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="495" y="514" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">RAG检索</text>
  <text x="495" y="535" text-anchor="middle" font-size="9" fill="#b45309">知识库向量</text>

  <path d="M545,510 L565,510" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="565" y="495" width="100" height="30" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="615" y="514" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">工具调用</text>
  <text x="615" y="535" text-anchor="middle" font-size="9" fill="#b45309">订单/物流/退款/商品</text>

  <path d="M665,510 L685,510" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="685" y="495" width="100" height="30" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="735" y="514" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">大模型生成</text>
  <text x="735" y="535" text-anchor="middle" font-size="9" fill="#b45309">ChatOpenAI+文案</text>

  <path d="M785,510 L805,510" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="805" y="495" width="70" height="30" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="840" y="509" text-anchor="middle" font-size="9" font-weight="600" fill="#92400e">置信度</text>
  <text x="840" y="521" text-anchor="middle" font-size="8" fill="#b45309">低→转人工</text>
  <text x="840" y="531" text-anchor="middle" font-size="8" fill="#b45309">通过→回复</text>

  <!-- 转人工兜底 -->
  <rect x="70" y="595" width="820" height="35" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="480" y="617" text-anchor="middle" font-size="11" font-weight="600" fill="#991b1b">转人工兜底层：AI模拟人工客服 · 随机分配客服名 · 换人设/Prompt · 上下文不中断</text>

  <!-- 后端 → Bot层 -->
  <path d="M690,315 L690,340 L480,340 L480,385" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============================================================ -->
  <!-- 第四层 + 第五层（横向并排）(y: 660-1040)                         -->
  <!-- ============================================================ -->

  <!-- 数据存储层（左） -->
  <rect x="40" y="660" width="430" height="380" rx="10" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="60" y="682" font-size="13" font-weight="700" fill="#7c3aed">第四层 · 数据存储层</text>

  <!-- PostgreSQL -->
  <rect x="70" y="695" width="370" height="95" rx="8" fill="#ffffff" stroke="#a78bfa" stroke-width="1.5" filter="url(#shadow)"/>
  <!-- DB 图标 -->
  <ellipse cx="100" cy="720" rx="15" ry="5" fill="none" stroke="#7c3aed" stroke-width="1.5"/>
  <path d="M85,720 L85,745 Q85,750 100,750 Q115,750 115,745 L115,720" fill="none" stroke="#7c3aed" stroke-width="1.5"/>
  <ellipse cx="100" cy="732" rx="15" ry="5" fill="none" stroke="#7c3aed" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="135" y="718" font-size="13" font-weight="700" fill="#5b21b6">PostgreSQL :5432</text>
  <text x="135" y="735" font-size="10" fill="#64748b">20张业务表</text>
  <text x="135" y="750" font-size="9" fill="#94a3b8">用户/订单/商品/会话/消息/知识库/Bot/渠道/报表</text>

  <!-- Redis -->
  <rect x="70" y="800" width="370" height="75" rx="8" fill="#ffffff" stroke="#a78bfa" stroke-width="1.5" filter="url(#shadow)"/>
  <!-- Redis 图标 -->
  <rect x="90" y="820" width="20" height="20" rx="3" fill="none" stroke="#dc2626" stroke-width="1.5"/>
  <path d="M95,825 L95,835 M100,825 L100,835 M105,825 L105,835" stroke="#dc2626" stroke-width="1"/>
  <text x="135" y="825" font-size="13" font-weight="700" fill="#5b21b6">Redis :6379</text>
  <text x="135" y="842" font-size="10" fill="#64748b">会话上下文 / Token缓存</text>
  <text x="135" y="856" font-size="9" fill="#94a3b8">进度缓存 / 限流计数</text>

  <!-- Qdrant -->
  <rect x="70" y="885" width="370" height="75" rx="8" fill="#ffffff" stroke="#a78bfa" stroke-width="1.5" filter="url(#shadow)"/>
  <!-- Qdrant 图标 -->
  <circle cx="100" cy="915" r="12" fill="none" stroke="#7c3aed" stroke-width="1.5"/>
  <circle cx="100" cy="915" r="3" fill="#7c3aed"/>
  <text x="135" y="910" font-size="13" font-weight="700" fill="#5b21b6">Qdrant :6333</text>
  <text x="135" y="927" font-size="10" fill="#64748b">知识库向量数据库</text>
  <text x="135" y="941" font-size="9" fill="#94a3b8">标准问题 / 相似问法 / bge 512维</text>

  <!-- 存储层内部说明 -->
  <rect x="70" y="975" width="370" height="50" rx="6" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="255" y="995" text-anchor="middle" font-size="10" fill="#6d28d9">混合检索：BM25 (30%) + 向量相似度 (70%)</text>
  <text x="255" y="1012" text-anchor="middle" font-size="9" fill="#94a3b8">Embedding 由 Encoder 服务提供 · 阈值 0.85</text>

  <!-- 基础服务层（右） -->
  <rect x="490" y="660" width="430" height="380" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="510" y="682" font-size="13" font-weight="700" fill="#ea580c">第五层 · 基础服务层</text>

  <!-- Encoder -->
  <rect x="520" y="695" width="185" height="85" rx="8" fill="#ffffff" stroke="#fb923c" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="612" y="715" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412">Encoder :8001</text>
  <text x="612" y="732" text-anchor="middle" font-size="10" fill="#64748b">bge-small-zh-v1.5</text>
  <text x="612" y="748" text-anchor="middle" font-size="9" fill="#94a3b8">文本 → 512维向量</text>
  <text x="612" y="765" text-anchor="middle" font-size="9" fill="#94a3b8">私有化部署</text>

  <!-- Celery -->
  <rect x="725" y="695" width="170" height="85" rx="8" fill="#ffffff" stroke="#fb923c" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="810" y="715" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412">Celery (可选)</text>
  <text x="810" y="732" text-anchor="middle" font-size="10" fill="#64748b">异步任务</text>
  <text x="810" y="748" text-anchor="middle" font-size="9" fill="#94a3b8">统计/超时/评价推送</text>
  <text x="810" y="765" text-anchor="middle" font-size="9" fill="#94a3b8">低内存可禁用</text>

  <!-- LLM API -->
  <rect x="520" y="795" width="185" height="85" rx="8" fill="#ffffff" stroke="#fb923c" stroke-width="1.5" filter="url(#shadow)"/>
  <!-- LLM 图标 -->
  <circle cx="545" cy="815" r="8" fill="none" stroke="#ea580c" stroke-width="1.5"/>
  <path d="M541,815 L549,815 M545,811 L545,819" stroke="#ea580c" stroke-width="1"/>
  <text x="612" y="815" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412">LLM API (外部)</text>
  <text x="612" y="832" text-anchor="middle" font-size="10" fill="#64748b">DeepSeek / Qwen</text>
  <text x="612" y="848" text-anchor="middle" font-size="9" fill="#94a3b8">OpenAI兼容接口</text>
  <text x="612" y="865" text-anchor="middle" font-size="9" fill="#94a3b8">128K上下文</text>

  <!-- Docker Compose -->
  <rect x="725" y="795" width="170" height="85" rx="8" fill="#ffffff" stroke="#fb923c" stroke-width="1.5" filter="url(#shadow)"/>
  <!-- Docker 图标 -->
  <rect x="745" y="808" width="18" height="18" rx="2" fill="none" stroke="#2496ed" stroke-width="1.5"/>
  <rect x="748" y="805" width="3" height="3" fill="#2496ed"/>
  <rect x="752" y="805" width="3" height="3" fill="#2496ed"/>
  <rect x="756" y="805" width="3" height="3" fill="#2496ed"/>
  <text x="810" y="815" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412">Docker Compose</text>
  <text x="810" y="832" text-anchor="middle" font-size="10" fill="#64748b">容器编排</text>
  <text x="810" y="848" text-anchor="middle" font-size="9" fill="#94a3b8">7个服务统一管理</text>
  <text x="810" y="865" text-anchor="middle" font-size="9" fill="#94a3b8">一键部署 docker compose up</text>

  <!-- 部署说明 -->
  <rect x="520" y="895" width="375" height="130" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="540" y="918" font-size="11" font-weight="700" fill="#92400e">Docker 部署要点</text>
  <text x="540" y="935" font-size="9" fill="#78716c">• 前端多阶段构建(Node编译+Nginx托管)</text>
  <text x="540" y="950" font-size="9" fill="#78716c">• 后端目录卷挂载，改.env无需重建</text>
  <text x="540" y="965" font-size="9" fill="#78716c">• PostgreSQL首次启动自动执行init.sql</text>
  <text x="540" y="980" font-size="9" fill="#78716c">• Encoder用HF_ENDPOINT=hf-mirror.com加速</text>
  <text x="540" y="995" font-size="9" fill="#78716c">• 前端npm用registry.npmmirror.com加速</text>
  <text x="540" y="1010" font-size="9" fill="#78716c">• 2-3G内存可注释celery服务</text>

  <!-- ============================================================ -->
  <!-- 跨层连线                                                       -->
  <!-- ============================================================ -->


  <text x="600" y="765" font-size="9" fill="#94a3b8">异步任务</text>

  <!-- 图例 -->
  <rect x="40" y="1030" width="880" height="40" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="60" y="1053" font-size="10" fill="#64748b">图例：</text>
  <line x1="100" y1="1050" x2="130" y2="1050" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

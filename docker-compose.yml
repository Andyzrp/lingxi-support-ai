version: '3.8'

services:
  # ==================== 中间件 ====================

  postgres:
    image: postgres:15-alpine
    container_name: lingxi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lingxi_support
      POSTGRES_USER: lingxi
      POSTGRES_PASSWORD: lingxi123456
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lingxi -d lingxi_support"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lingxi_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: lingxi_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== 后端服务 ====================

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lingxi_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://lingxi:lingxi123456@postgres:5432/lingxi_support
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/__pycache__
      - ./uploads:/app/uploads

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lingxi_celery
    restart: unless-stopped
    command: celery -A app.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://lingxi:lingxi123456@postgres:5432/lingxi_support
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/__pycache__
      - ./uploads:/app/uploads

  # ==================== 前端服务 ====================

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lingxi_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

  # ==================== 向量编码服务（可选） ====================

  encoder:
    build:
      context: ./encoder
      dockerfile: Dockerfile
    container_name: lingxi_encoder
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      qdrant:
        condition: service_healthy

  # ==================== Nginx反向代理 ====================

  nginx:
    image: nginx:alpine
    container_name: lingxi_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
  qdrant_data:

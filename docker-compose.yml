version: '3.8'

services:
  # ==================== 中间件 ====================

  postgres:
    image: postgres:15-alpine
    container_name: lingxi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lingxi_support
      POSTGRES_USER: lingxi
      POSTGRES_PASSWORD: lingxi123456
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # 首次启动自动执行 sql 目录下的 init.sql（仅当数据卷为空时执行一次）
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lingxi -d lingxi_support"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lingxi_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: lingxi_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # qdrant 镜像内无 curl，用 bash 原生 TCP 探测 6333 端口
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== 后端服务 ====================

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lingxi_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://lingxi:lingxi123456@postgres:5432/lingxi_support
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      # 注入容器间通信所需的服务名（覆盖 backend/.env 中的内网 IP）
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - EMBEDDING_HOST=encoder
      - EMBEDDING_PORT=8001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      encoder:
        condition: service_started
    volumes:
      - ./backend:/app
      - /app/__pycache__
      - ./uploads:/app/uploads

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lingxi_celery
    restart: unless-stopped
    # 修正模块路径：实际 celery_app 在 app/core/celery_app.py
    command: celery -A app.core.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://lingxi:lingxi123456@postgres:5432/lingxi_support
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - EMBEDDING_HOST=encoder
      - EMBEDDING_PORT=8001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      encoder:
        condition: service_started
    volumes:
      - ./backend:/app
      - /app/__pycache__
      - ./uploads:/app/uploads

  # ==================== 前端服务 ====================

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lingxi_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    # 注意：不挂载源码到 /app。frontend/Dockerfile 是多阶段生产构建，
    # 镜像里已包含 dist/ 静态产物，挂载 ./frontend:/app 会把构建产物覆盖掉。

  # ==================== 向量编码服务（可选） ====================

  encoder:
    build:
      context: ./encoder
      dockerfile: Dockerfile
    container_name: lingxi_encoder
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      qdrant:
        condition: service_healthy

  # ==================== Nginx反向代理 ====================

  nginx:
    image: nginx:alpine
    container_name: lingxi_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
